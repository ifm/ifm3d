variables:
  VERSION: 
    description: "Release version in format vx.x.x"

version:update_version:
  stage: version
  image: python:3
  tags: [shared_docker]

  before_script:
  - |
    apt-get -y update
    apt-get -y install git
    git config --global user.email "support.robotics@ifm.com"
    git config --global user.name "ifm-csr"

  script:
  - |
    python3 scripts/release/update_version.py --version=${VERSION}
    git commit -a -m "Release/${VERSION}: update changelog and version"
    git remote set-url origin https://"ifm-csr":$RELEASE_ACCESS_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git
    git push origin HEAD:refs/heads/$CI_COMMIT_BRANCH
  rules:
    # only release from the default branch or a release/* maintenance branch, never from arbitrary branches
    - if: ($VERSION != "") && (($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) || ($CI_COMMIT_BRANCH =~ /^release\//))
      when: always
    - when: never
   
